services:
  postgres:
    image: postgres:16-alpine
    container_name: evernear_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-carely_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carely_secret_password}
      POSTGRES_DB: ${DB_NAME:-carely_db}
    volumes:
      - evernear_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-carely_user} -d ${DB_NAME:-carely_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evernear_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evernear_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evernear_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  evernear_pgdata:
  evernear_redisdata:
