services:
  postgres:
    image: postgres:16-alpine
    container_name: carely_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carely_user
      POSTGRES_PASSWORD: carely_secret_password
      POSTGRES_DB: carely_db
    ports:
      - "5435:5432"
    volumes:
      - carely_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carely_user -d carely_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carely_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - carely_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: carely_adminer
    restart: unless-stopped
    ports:
      - "8086:8080"
    depends_on:
      - postgres

volumes:
  carely_pgdata:
  carely_redisdata:

