# ==============================================================================
# Evernear Production Nginx Configuration — evernear.erai.vn
# ==============================================================================
# Architecture & Directory Layout:
#   - /opt/evernear/flutter : Flutter Web SPA build (mobile/build/web)
#   - /opt/evernear/landing : Static Marketing Landing & Legal Pages (landing/)
#   - 127.0.0.1:3000        : NestJS Backend (REST API + WebSocket + SSE)
# ==============================================================================

# Isolated WebSocket Upgrade header mapping (avoids conflict with global conf.d)
map $http_upgrade $evernear_connection_upgrade {
    default upgrade;
    ''      close;
}

# Isolated Rate Limiting Zones for Evernear
limit_req_zone $binary_remote_addr zone=evernear_auth_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=evernear_api_limit:10m  rate=30r/s;

# Backend Upstream Pool (NestJS on 127.0.0.1:3000)
upstream evernear_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Certbot ACME Challenge & Permanent Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name evernear.erai.vn;

    server_tokens off;

    # Let's Encrypt Certbot Webroot Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Main Production Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evernear.erai.vn;

    server_tokens off;

    # --- SSL / TLS Certificates (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/evernear.erai.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evernear.erai.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Default Document Root (Flutter Web SPA) ---
    root /opt/evernear/flutter;
    index index.html;
    charset utf-8;

    # --- Client Request Limits & Timeouts ---
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Evernear Privacy-by-Default Manifesto: Never access camera or microphone on web
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # --- Gzip Compression (HTML, CSS, JS, JSON, WASM, Fonts, SVG) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/wasm
        application/manifest+json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ==========================================================================
    # 1. BACKEND REST API (/api/v1/*)
    # ==========================================================================

    # Stricter rate limit for Authentication endpoints (login / register / social)
    location ~ ^/api/v1/auth/(login|register|social) {
        limit_req zone=evernear_auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://evernear_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # General REST API endpoints:
    # /api/v1/health, /api/v1/auth/*, /api/v1/users/*, /api/v1/devices/*,
    # /api/v1/heartbeat, /api/v1/activities/*, /api/v1/check-ins/*,
    # /api/v1/monitoring/*, /api/v1/incidents/*, /api/v1/locations/*
    location ^~ /api/ {
        limit_req zone=evernear_api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://evernear_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # 2. REAL-TIME GATEWAY (WebSocket /ws & Server-Sent Events /realtime/*)
    # ==========================================================================

    # Native WebSocket Gateway (/ws?token=...)
    location = /ws {
        proxy_pass http://evernear_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $evernear_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /ws/ {
        proxy_pass http://evernear_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $evernear_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Server-Sent Events (SSE) & Realtime Health (/realtime/stream, /realtime/health)
    location ^~ /realtime/ {
        proxy_pass http://evernear_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Required for SSE streaming without Nginx buffering delays
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==========================================================================
    # 3. STATIC LANDING & LEGAL PAGES (/opt/evernear/landing)
    # ==========================================================================

    # Named location fallback for static landing page
    location @landing {
        root /opt/evernear/landing;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    # Static HTML Landing route (/landing -> /landing/)
    location = /landing {
        return 301 /landing/;
    }

    location = /landing/ {
        root /opt/evernear;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        rewrite ^ /landing/index.html break;
    }

    # Legal & GDPR Account Deletion pages (/privacy, /terms, /delete-account)
    location ~ ^/privacy(\.html|/)?$ {
        root /opt/evernear/landing;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /privacy.html =404;
    }

    location ~ ^/terms(\.html|/)?$ {
        root /opt/evernear/landing;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /terms.html =404;
    }

    location ~ ^/delete-account(\.html|/)?$ {
        root /opt/evernear/landing;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /delete-account.html =404;
    }

    # Static Landing CSS & JS
    location = /evernear.css {
        root /opt/evernear/landing;
        default_type text/css;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /evernear.css =404;
    }

    location = /evernear.js {
        root /opt/evernear/landing;
        default_type application/javascript;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /evernear.js =404;
    }

    # Static Landing 36-language i18n JSON dictionaries (/i18n/*.json)
    location ^~ /i18n/ {
        root /opt/evernear/landing;
        default_type application/json;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fallback i18n dictionary path used by Flutter Web SiteI18nController (/site/i18n/*.json)
    location ^~ /site/ {
        root /opt/evernear/flutter;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    # Static Landing Fonts & Images (/fonts/*, /img/*)
    location ^~ /fonts/ {
        root /opt/evernear/landing;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /img/ {
        root /opt/evernear/landing;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ==========================================================================
    # 4. FLUTTER WEB APPLICATION (/opt/evernear/flutter)
    # ==========================================================================

    # WebAssembly binaries (CanvasKit / Skwasm) — require exact application/wasm MIME
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Critical Flutter Web bootstrap & Service Worker files (MUST NOT cache stale)
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|firebase-messaging-sw\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires -1;
        try_files $uri @landing;
    }

    # Flutter bundled assets, CanvasKit engine & PWA icons
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Flutter Web SPA History Routing (`usePathUrlStrategy()`)
    # Supports: /, /login, /register, /onboarding, /dashboard, /check-in,
    # /activities, /devices, /monitoring-settings, /incidents, /incident,
    # /incident-detail, /settings, /profile, /account, /privacy-security,
    # /notifications, /language, /invite, /qr-invite, /scan, /qr-scan
    # Note: Do NOT include $uri/ here, otherwise "/" matches the directory
    # /opt/evernear/flutter/ and fails with 403 if index.html is missing.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        try_files $uri /index.html @landing;
    }

    # ==========================================================================
    # 5. SECURITY: BLOCK HIDDEN FILES (.git, .env, .htaccess, etc.)
    # ==========================================================================
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
