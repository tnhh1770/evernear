# ==============================================================================
# Nginx Configuration for evernear.erai.vn
# Serves:
#   1. Static Landing & Legal Pages (/, /privacy, /terms, /delete-account, /evernear.*, /i18n/, /img/, /fonts/)
#   2. Flutter Web Application (SPA routes: /login, /register, /dashboard, /onboarding, /invite, etc.)
#   3. NestJS Backend REST API (/api/v1/* -> 127.0.0.1:3000)
#   4. Real-time WebSocket Gateway (/ws -> 127.0.0.1:3000/ws)
#
# Note on SSL:
#   - Works immediately on port 80 (and behind Cloudflare Proxy).
#   - To enable direct Let's Encrypt HTTPS on the VPS, run after reloading Nginx:
#       sudo certbot --nginx -d evernear.erai.vn
#     Certbot will automatically add the `listen 443 ssl` directives to this block.
# ==============================================================================

upstream evernear_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name evernear.erai.vn;

    # Root directories:
    # - /var/www/evernear/web     : Flutter Web build output (build/web)
    # - /var/www/evernear/landing : Static Landing pages (landing/)
    root /var/www/evernear/web;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml font/ttf;

    client_max_body_size 10M;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --------------------------------------------------------------------------
    # 1. Backend REST API (/api/v1/*)
    # --------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://evernear_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Backend Real-time WebSocket (/ws)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://evernear_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 3. Static Landing & Legal Pages (Fast SEO & OpenGraph delivery)
    # --------------------------------------------------------------------------
    location = / {
        root /var/www/evernear/landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /privacy {
        root /var/www/evernear/landing;
        try_files /privacy.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /terms {
        root /var/www/evernear/landing;
        try_files /terms.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /delete-account {
        root /var/www/evernear/landing;
        try_files /delete-account.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(evernear\.css|evernear\.js)$ {
        root /var/www/evernear/landing;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ ^/(i18n|img|fonts)/ {
        root /var/www/evernear/landing;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # 4. Flutter Web App & Assets (/login, /register, /dashboard, /invite, etc.)
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
